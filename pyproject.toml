[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "payrag"
version = "0.1.0"
description = "Reproducible Stripe documentation acquisition and RAG evaluation tooling"
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.1", "pydantic==2.13.4"]

[project.optional-dependencies]
dense = ["numpy==2.2.6", "sentence-transformers==5.6.0"]
api = ["fastapi==0.138.0", "httpx==0.28.1", "uvicorn==0.49.0"]
openai = ["openai==2.43.0"]

[project.scripts]
payrag = "payrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
